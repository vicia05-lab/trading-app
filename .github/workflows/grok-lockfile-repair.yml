name: Prepare Reviewed Grok Repair Tree
on:
  push:
    branches: ['fix/grok-app-completion-20260916']
    paths: ['.github/workflows/grok-lockfile-repair.yml', '.grok-repair/**']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    if: github.repository == 'vicia05-lab/trading-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply the exact reviewed source patch
        run: |
          test "$GITHUB_REPOSITORY" = 'vicia05-lab/trading-app'
          mkdir -p /tmp/grok-reviewed-tree
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          parts = [pathlib.Path(f'.grok-repair/patch.{n:02d}.b64').read_text() for n in (1, 2, 3)]
          # Normalize two identified transport transcription errors, then require
          # the original reviewed checksum. No unchecked payload is applied.
          parts[1] = parts[1].replace('Y4bV1dsWa', 'Y4bV0dsWa')
          parts[2] = parts[2].replace('stusSNsohuOW0LZWspGLddVGk0', 'stx2o4ektjdlu1lbajakw1')
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = '0f6cf0b7566f32ed38593fbabaa068c628c06baa57d79e2d9144ce1c30a96a40'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Reviewed patch checksum mismatch'
          pathlib.Path('/tmp/grok-reviewed-tree/approved.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '/tmp/grok-reviewed-tree/approved.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/grok-reviewed-tree/approved.patch'], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/grok-lockfile-repair.yml', '.grok-repair/patch.01.b64', '.grok-repair/patch.02.b64', '.grok-repair/patch.03.b64'], check=True)
          expected_tree = '5d87472498b7e8f5e3f11a6ff8202738bad4c98e'
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == expected_tree, f'Source tree differs from reviewed local tree: {tree}'
          pathlib.Path('/tmp/grok-reviewed-tree/local-tree-sha.txt').write_text(tree + '\n')
          print('Reviewed patch and complete final tree checksums verified. No branch changed.')
          PY
      - name: Upload reviewed blobs and tree only, without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const repository = 'vicia05-lab/trading-app';
          if (process.env.GITHUB_REPOSITORY !== repository) throw new Error('Wrong repository');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const parent = git('rev-parse', 'HEAD');
          const baseTree = git('rev-parse', 'HEAD^{tree}');
          const expectedTree = '5d87472498b7e8f5e3f11a6ff8202738bad4c98e';
          async function api(path, body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/git/${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`Git object upload failed: ${response.status}`);
            return response.json();
          }
          const changes = git('diff', '--cached', '--name-status').split('\n').filter(Boolean);
          const tree = [];
          for (const change of changes) {
            const [status, path] = change.split('\t');
            if (!['A', 'M', 'D'].includes(status) || !path || path.includes('..')) throw new Error('Unexpected changed path');
            if (status === 'D') {
              if (!path.startsWith('.grok-repair/') && path !== '.github/workflows/grok-lockfile-repair.yml') throw new Error('Unexpected deletion');
              tree.push({ path, mode: '100644', type: 'blob', sha: null });
            } else {
              const content = await readFile(path);
              const blob = await api('blobs', { content: content.toString('base64'), encoding: 'base64' });
              if (!/^[0-9a-f]{40}$/.test(blob.sha)) throw new Error('Invalid blob response');
              const mode = git('ls-files', '--stage', '--', path).split(' ')[0];
              tree.push({ path, mode, type: 'blob', sha: blob.sha });
            }
          }
          const result = await api('trees', { base_tree: baseTree, tree });
          if (result.sha !== expectedTree) throw new Error('GitHub tree does not match reviewed local tree');
          const record = { repository, parent_sha: parent, tree_sha: result.sha, patch_sha256: '0f6cf0b7566f32ed38593fbabaa068c628c06baa57d79e2d9144ce1c30a96a40', changes };
          await writeFile('/tmp/grok-reviewed-tree/tree-result.json', JSON.stringify(record, null, 2) + '\n');
          console.log(`Verified candidate tree: ${result.sha}. No branch, runtime, database or deployment changed.`);
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: grok-reviewed-source-tree
          path: /tmp/grok-reviewed-tree/
          retention-days: 3
